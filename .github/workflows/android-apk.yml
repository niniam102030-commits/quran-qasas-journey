name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Validate content integrity (strict structural + deep check)
        run: npm run validate:all

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Compute Android version
        id: version
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="$(jq -r .version package.json)"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Android versionName=$VERSION_NAME (versionCode=$VERSION_CODE)"

      - name: Build Android APK (Signed Release if secrets configured, else Debug fallback)
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            export KEYSTORE_PATH="$PWD/app/release-keystore.jks"
            ./gradlew assembleRelease --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets are not set. Falling back to ephemeral debug APK which CANNOT upgrade previous installs without uninstalling and losing user data."
            ./gradlew assembleDebug --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-keystore.jks

      - name: Copy & rename APK
        run: |
          mkdir -p release-apk
          APK_NAME="quran-qasas-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$APK_PATH" "release-apk/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Print APK signing certificate SHA-256 fingerprint
        run: |
          keytool -printcert -jarfile "release-apk/$APK_NAME" | grep -E "Owner:|Issuer:|Valid|SHA256:" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-qasas-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: release-apk/${{ env.APK_NAME }}
          retention-days: 30

      - name: Attach APK to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/${{ env.APK_NAME }}
