name: Generate Android Release Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate Release Keystore & Secrets Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Generate release keystore and secrets files
        run: |
          set -euo pipefail
          mkdir -p keystore-out

          KEY_ALIAS="qasas"
          STORE_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"

          # Mask generated passwords so they never appear in workflow logs
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          keytool -genkeypair -v \
            -keystore keystore-out/release.keystore \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Quran Qasas Journey, OU=Mobile, O=Quran Qasas, L=Tehran, S=Tehran, C=IR" \
            >/dev/null 2>&1

          base64 -w 0 keystore-out/release.keystore > keystore-out/keystore.b64.txt

          printf 'KEY_ALIAS=%s\nKEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' "$KEY_ALIAS" "$STORE_PASS" "$KEY_PASS" > keystore-out/SECRETS.txt

          echo "Keystore generated successfully (alias=$KEY_ALIAS, validity=10000 days)."
          keytool -list -v -keystore keystore-out/release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep -E "SHA256:|Valid from:" || true

      - name: Upload keystore secrets artifact (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-secrets
          path: |
            keystore-out/release.keystore
            keystore-out/keystore.b64.txt
            keystore-out/SECRETS.txt
          retention-days: 1
