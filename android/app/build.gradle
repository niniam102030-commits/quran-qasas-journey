apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

import java.security.MessageDigest

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def resolvedKeystorePath = System.getenv('KEYSTORE_PATH') ?: keystoreProps.getProperty('storeFile')
def resolvedKeystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def resolvedKeyAlias = System.getenv('KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def resolvedKeyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasReleaseSigning = resolvedKeystorePath && resolvedKeystorePassword && resolvedKeyAlias && resolvedKeyPassword

def resolvedVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: project.findProperty('versionCode') ?: '2').toInteger()
def resolvedVersionName = (System.getenv('ANDROID_VERSION_NAME') ?: project.findProperty('versionName') ?: '1.0.1').toString()

android {
    namespace = "com.quran.qasas"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.quran.qasas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(resolvedKeystorePath)
                storePassword resolvedKeystorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters 'arm64-v8a'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

def sherpaOnnxVersion = '2.0.3'
def sherpaAarFile = file("libs/sherpa-onnx-${sherpaOnnxVersion}.aar")
def sherpaAarUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/sherpa-onnx-${sherpaOnnxVersion}.aar"
def sherpaAarSha256 = '4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50'

tasks.register('downloadSherpaOnnxAar') {
    outputs.file(sherpaAarFile)
    doLast {
        def sha256Of = { File f ->
            MessageDigest md = MessageDigest.getInstance('SHA-256')
            f.withInputStream { is ->
                byte[] buf = new byte[8192]
                int n
                while ((n = is.read(buf)) > 0) {
                    md.update(buf, 0, n)
                }
            }
            md.digest().collect { String.format('%02x', it) }.join('')
        }
        if (sherpaAarFile.exists() && sha256Of(sherpaAarFile) == sherpaAarSha256) {
            return
        }
        sherpaAarFile.parentFile.mkdirs()
        File tmp = new File(sherpaAarFile.parentFile, "${sherpaAarFile.name}.tmp")
        new URL(sherpaAarUrl).withInputStream { input ->
            tmp.withOutputStream { output -> output << input }
        }
        def actual = sha256Of(tmp)
        if (actual != sherpaAarSha256) {
            tmp.delete()
            throw new GradleException("sherpa-onnx AAR SHA-256 mismatch: expected ${sherpaAarSha256}, got ${actual}")
        }
        if (sherpaAarFile.exists()) sherpaAarFile.delete()
        tmp.renameTo(sherpaAarFile)
    }
}

preBuild.dependsOn(downloadSherpaOnnxAar)

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files("libs/sherpa-onnx-${sherpaOnnxVersion}.aar")
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
